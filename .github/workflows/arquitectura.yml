name: Arquitectura YOD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Commit base completo; opcional junto a head_sha
        required: false
        type: string
      head_sha:
        description: Commit completo a validar; opcional junto a base_sha
        required: false
        type: string

permissions:
  contents: read

jobs:
  impacto:
    name: Arquitectura YOD
    runs-on: ubuntu-24.04  # Playwright 1.58.2 no soporta Chromium en ubuntu-latest (26.04)
    steps:
      - name: Validar referencias manuales
        env:
          BASE_INPUT: ${{ inputs.base_sha }}
          HEAD_INPUT: ${{ inputs.head_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_INPUT$HEAD_INPUT" ]; then
            [[ "$BASE_INPUT" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Se requieren ambos SHA completos.'; exit 1; }
          fi
          if [ -n "$HEAD_INPUT" ]; then
            [ "$HEAD_INPUT" = "$EVENT_SHA" ] || { echo 'El SHA solicitado debe coincidir con el ref que recibe el check.'; exit 1; }
          fi
      - name: Código completo del cambio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Atlas aprobado
        uses: actions/checkout@v4
        with:
          repository: yodesarrollomx/yod-portal
          ref: 505d6b6f540e3b0a704659c665e64be1e4e698a1
          path: .yod-atlas
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/verificar-impacto.cjs
            /docs/arquitectura/modelo.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contratos de Brokers
        run: node --test tests/brokers*.test.cjs
      - name: Sintaxis del flujo de preevaluación
        run: |
          node --check master-brokers/app.mjs
          node --check master-brokers/data.mjs
          node --check brokers.js
          node --check brokers-crm.js
          node --check brokers-core.js
          node --check brokers-evaluator.js
          node --check presentacion/board-core.js
          node --check presentacion/board-store.js
          node --check presentacion/board.js
          node --check presentacion/story-core.js
          node --check presentacion/source.js
          node --check presentacion/story.js
          node --check presentacion/hunt-core.js
          node --check presentacion/hunt.js
          node --check presentacion/thread-core.js
          node --check presentacion/monoline-core.js
          node --check presentacion/monoline.js
          node --check presentacion/principal-core.js
          node --check presentacion/principal.js
          node --check presentacion/slider-core.js
          node --check presentacion/slider-art.js
          node --check presentacion/slider.js
          node --check presentacion/pin-delivery.js
          node --check presentacion/pin-gateway.js
          node --check presentacion/atlas-pins.js
          node --check presentacion/vendor/yod-chinche.js
          node --check presentacion/vendor/html2canvas.min.js
          node --check presentacion/atlas-mobile.js
          node --check presentacion/intent.js
          node --check presentacion/intent-core.js
          node --check presentacion/intent-motion.js
          node --check presentacion/intent-art.js
          node --check presentacion/offer-art.js
          node --check presentacion/intent-mobile.js
          node --check presentacion/atlas.js
          node --check presentacion/atlas-core.js
          node --check presentacion/atlas-art.js
          node --check presentacion/simple.js
          node --check presentacion/simple-diagrams.js
          git diff --check HEAD^ HEAD
      - name: Navegador con servicios sintéticos
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium webkit
          node tests/brokers-public-preview-browser.cjs
          node tests/brokers-crm-browser.cjs
          node tests/brokers-workspace-browser.cjs
          node tests/brokers-evaluator-browser.cjs
          node tests/brokers-journey-browser.cjs
          node tests/presentation-hub-browser.cjs
          node tests/brokers-board-browser.cjs
          QA_BOARD_ENGINE=webkit node tests/brokers-board-browser.cjs
      - name: Presentación con fuente pública validada
        env:
          VERIFY_PUBLISHED_STORY: ${{ github.event_name == 'push' && '1' || startsWith(github.head_ref, 'codex/verify-published-story') && '1' || '0' }}
          YOD_PUBLIC_SOURCE_SNAPSHOT_DIR: ${{ runner.temp }}/yod-public-source-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node tests/obregon-storyboard-browser.cjs
          QA_DIR=abasto-review-artifacts node tests/abasto-storyboard-browser.cjs
          node tests/brokers-pin-delivery-browser.cjs
          node tests/brokers-pins-browser.cjs
          node tests/brokers-intent-browser.cjs
          node tests/intent-continuity-browser.cjs
          node tests/intent-visual-browser.cjs
          node tests/offer-review-browser.cjs
          node tests/brokers-atlas-browser.cjs
          node tests/brokers-slider-browser.cjs
          node tests/brokers-simple-browser.cjs
          node tests/brokers-principal-browser.cjs
          node tests/brokers-story-browser.cjs
          node tests/brokers-hunt-browser.cjs
          node tests/brokers-monoline-browser.cjs
      - name: Vistas reales principal y beta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investor-scene1-mobile
          path: |
            board-review-artifacts/
            investor-scene*-mobile.png
            hunt-*.png
            mono-*.jpg
            principal-*.jpg
            simple-*.jpg
            slider-*.jpg
            atlas-*.jpg
            intent-*.jpg
            offer-review-artifacts/
            abasto-review-artifacts/
            mobile-*.jpg
            pin-*.jpg
            pin-*.png
          retention-days: 7
      - name: Resolver comparación
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          BASE_INPUT: ${{ inputs.base_sha }}
          HEAD_INPUT: ${{ inputs.head_sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_SHA="$PR_BASE"
          elif [ "$EVENT_NAME" = push ]; then
            BASE_SHA="$PUSH_BASE"
          elif [ -n "$BASE_INPUT" ]; then
            BASE_SHA="$BASE_INPUT"
            [ "$HEAD_SHA" = "$HEAD_INPUT" ] || { echo 'El checkout no coincide con el commit solicitado.'; exit 1; }
            [ "$BASE_SHA" != "$HEAD_SHA" ] || { echo 'La comparación no puede estar vacía.'; exit 1; }
            EXPECTED_BASE=$(git merge-base "$HEAD_SHA" origin/main)
            [ "$EXPECTED_BASE" != "$HEAD_SHA" ] || { echo 'Para commits de main usa dispatch sin inputs.'; exit 1; }
            [ "$BASE_SHA" = "$EXPECTED_BASE" ] || { echo 'La base debe cubrir todo el cambio respecto de main.'; exit 1; }
          else
            BASE_SHA=$(git merge-base HEAD origin/main)
            # En main se comprueba el último cambio, evitando una comparación vacía.
            if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
              BASE_SHA=$(git merge-base HEAD^ origin/main)
            fi
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]] || { echo 'Falta una base histórica válida.'; exit 1; }
          git cat-file -e "$BASE_SHA^{commit}"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Verificar impacto contra el atlas
        env:
          BASE_SHA: ${{ steps.refs.outputs.base }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
        run: node .yod-atlas/scripts/verificar-impacto.cjs --model .yod-atlas/docs/arquitectura/modelo.json --base "$BASE_SHA" --head "$HEAD_SHA" --repo "$GITHUB_REPOSITORY"
