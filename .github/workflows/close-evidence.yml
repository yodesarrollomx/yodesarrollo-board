name: Read presentation review evidence
on:
  push:
    branches: [codex/presentation-close-evidence]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify published assets match merged revision
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, time
          revision="9cec280cb0104bb4cccc602212f629a3276bc30c"
          for path in ["presentacion/index.html","presentacion/intent.js","brokers.html"]:
              expected=urllib.request.urlopen("https://raw.githubusercontent.com/yodesarrollomx/yodesarrollo-board/"+revision+"/"+path,timeout=30).read()
              for attempt in range(8):
                  actual=urllib.request.urlopen("https://yodesarrollomx.github.io/yodesarrollo-board/"+path+"?verify="+revision+"&attempt="+str(attempt),timeout=30).read()
                  if actual==expected: break
                  time.sleep(10)
              assert actual==expected,path+" differs from merged revision"
              print("PUBLISHED_MATCH",path,hashlib.sha256(actual).hexdigest())
          PY
