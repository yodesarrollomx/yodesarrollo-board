<!doctype html>
<html lang="es" class="intent-story"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F6F3EC"><title>YoDesarrollo · Recorrido</title><link rel="preload" href="fonts/caveat.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/dm-regular.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/dm-bold.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="atlas.css?v=single-1"><link rel="stylesheet" href="intent.css?v=offer-4"><link rel="stylesheet" href="offer-art.css?v=offer-4"></head><body>
<div id="loading" role="status"><span class="loading-mark"></span><p id="loadText">Preparando el recorrido…</p><button id="retry" hidden>Reintentar</button></div>
<main id="journey" hidden>
<header class="masthead"><a class="wordmark" href="./" aria-label="YoDesarrollo"><img id="brand" src="../assets/logo_dark.png" alt="YoDesarrollo" width="560" height="99"></a><div class="header-actions"><button id="contents" class="quiet" aria-label="Consultar contenido">Contenido</button><button id="share" class="quiet" aria-label="Compartir">↗</button></div></header>
<div class="workspace">
<section class="intro"><p class="eyebrow" id="eyebrow"></p><div class="chapter-number"><span id="chapterCount"></span><span class="rule"></span><span id="chapterLabel"></span></div><h1 id="title"></h1><p id="stepHeading"></p><div class="desktop-hint"><span class="hint-line"></span><span id="notice"></span></div></section>
<section class="explanation" aria-label="Diagrama y explicación">
<figure id="diagram"><div class="drawing-head"><span id="drawingTitle"></span><span id="drawingNote"></span></div><div id="artFrame"><svg id="art" viewBox="0 0 640 420" role="img" aria-labelledby="artTitle artDesc"><title id="artTitle"></title><desc id="artDesc"></desc></svg><div id="diagramLabels" aria-hidden="true"></div></div><figcaption id="figureNote"></figcaption><a class="map-source" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">Fuente ↗</a></figure>
<div id="idea"><div class="idea-top"><span id="moment"></span><div id="beats" aria-hidden="true"><i></i><i></i><i></i></div></div><p id="body"></p></div>
<div id="actions" hidden></div>
</section></div>
<footer class="dock"><div class="dock-inner"><nav id="chapters" aria-label="Paradas del recorrido"></nav><div class="transport"><button id="prev" class="arrow" aria-label="Anterior">←</button><div class="range-wrap"><label for="progress" class="sr-only" id="rangeLabel">Recorrido</label><input id="progress" type="range" min="0" max="26" step="0.01" value="0"><div class="range-meta"><button id="restart">Volver al inicio</button><span id="position" aria-live="polite"></span></div></div><button id="next" class="arrow primary" aria-label="Siguiente">→</button></div></div></footer>
</main>
<dialog id="reader"><div class="dialog-head"><h2 id="readerTitle"></h2><button class="close" data-close="reader" aria-label="Cerrar">×</button></div><div id="readerBody"></div><a class="archive-link" id="archive" href="single.html"></a></dialog>
<dialog id="contact"><div class="dialog-head"><h2 id="contactTitle"></h2><button class="close" data-close="contact" aria-label="Cerrar">×</button></div><p id="contactHelp">Puedes compartir este mensaje con la persona que te presentó la oportunidad.</p><textarea id="message" rows="6" readonly></textarea><div class="contact-actions"><button id="copy" class="primary">Copiar mensaje</button><button id="send">Compartir mensaje</button></div><p id="copyState" role="status"></p></dialog>
<button type="button" id="pin-button" data-pin-ui aria-label="Señalar un cambio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 0-1 6 4 4H5l4-4-1-6ZM12 13v8"/></svg></button>
<div id="pin-selection" data-pin-ui hidden aria-label="Seleccionar una zona para revisión"><p role="status">Preparando captura…</p><button type="button" id="pin-cancel" aria-label="Cancelar selección">×</button><div id="pin-region"></div></div>
<dialog id="pin-review" data-pin-ui aria-labelledby="pin-review-title"><div class="dialog-head"><h2 id="pin-review-title">Revisión</h2><button type="button" id="pin-review-close" class="close" aria-label="Cerrar revisión">×</button></div><p id="pin-review-status" role="status"></p><div id="pin-review-content"></div></dialog>
<noscript>Activa JavaScript para explorar el recorrido interactivo.</noscript>

<script src="vendor/html2canvas.min.js?v=single-1"></script><script src="vendor/yod-chinche.js?v=sala-pins-1"></script><script src="pin-delivery.js?v=sala-pins-1"></script><script src="atlas-pins.js?v=sala-pins-1"></script>
</body></html>
