    ⚠ CONFIG · pega aquí la URL /exec de tu Apps Script desplegado.
    Toda la data viene del Apps Script con credencial del Portero;
    este repo no contiene datos ni secretos.
  -->
  <script>
    window.YDR_CONFIG = {
      appsScriptUrl: "https://script.google.com/macros/s/AKfycbynq5JFU2AROO2gpOm6gbuedB_ZlwXoCej1eDO8rmXo63_QWnCBAy3_73il8NGc2u5N2Q/exec",

      // Va CIFRADO (AES-256-CBC/PBKDF2, mismo esquema que el pintarrón): se abre
      // con la clave de equipo del Portero, nunca con un simple curl.
      datosRespaldo: "datos.enc"
    };
  </script>

  <!--
    Acceso: lo gobierna el Portero YOD (portero.js, al final del body).
